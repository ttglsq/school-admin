name: Supabase Keep-Alive
on:
  schedule:
    - cron: '30 1 */3 * *'
  workflow_dispatch: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_KEY: sb_publishable_6yGVfnZtZPyXVJ6eCqp1dQ_TQ4MuUAn
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "https://yigtntahxnrnrrwgnars.supabase.co/rest/v1/app_data?select=id&limit=1")
          echo "HTTP ${code}"
          [ "${code}" = "200" ] || exit 1
